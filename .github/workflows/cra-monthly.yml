name: Monthly Canadian CRA updates
on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cra-monthly-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve CRA feeds once per month
        run: node scripts/update-cra.mjs
      - name: Save the monthly snapshot
        run: |
          if git diff --quiet -- public/cra-updates.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cra-updates.json
          git commit -m 'Refresh monthly Canadian CRA headlines'
          git pull --rebase origin main
          git push origin HEAD:main
