<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-label="Hairouna logo">
<defs>
 <radialGradient id="mOnyx" cx="35%" cy="26%" r="90%">
  <stop offset="0" stop-color="#27498a"/><stop offset=".45" stop-color="#102450"/><stop offset="1" stop-color="#050b1c"/>
 </radialGradient>
 <radialGradient id="mHalo" cx="50%" cy="50%" r="50%">
  <stop offset=".55" stop-color="#ffd76b" stop-opacity="0"/><stop offset=".8" stop-color="#ffd76b" stop-opacity=".28"/><stop offset="1" stop-color="#ffd76b" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="mRing" x1="0" y1="0" x2=".85" y2="1">
  <stop offset="0" stop-color="#fff7d6"/><stop offset=".18" stop-color="#ffdf7e"/><stop offset=".38" stop-color="#f0b93c"/>
  <stop offset=".55" stop-color="#9a6d1e"/><stop offset=".7" stop-color="#5e4312"/><stop offset=".85" stop-color="#e3b64a"/><stop offset="1" stop-color="#ffe9a8"/>
 </linearGradient>
 <linearGradient id="mSilver" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f4f8ff"/><stop offset=".5" stop-color="#8fa3c0"/><stop offset="1" stop-color="#dfe8f5"/>
 </linearGradient>
 <linearGradient id="mFace" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff3bd"/><stop offset=".38" stop-color="#ffd76b"/><stop offset=".55" stop-color="#d9a83c"/>
  <stop offset=".82" stop-color="#8a6526"/><stop offset="1" stop-color="#c79b3d"/>
 </linearGradient>
 <linearGradient id="mEdge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="mSheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <clipPath id="mClip"><circle cx="120" cy="120" r="110"/></clipPath>
</defs><style>
.mswp{animation:mswp 4.6s cubic-bezier(.4,.1,.3,1) infinite}
@keyframes mswp{0%,55%{transform:translateX(-300px) skewX(-18deg)}80%,100%{transform:translateX(520px) skewX(-18deg)}}
.mgl{animation:mgl 3.4s ease-in-out infinite}.mgl.g2{animation-delay:1.7s}.mgl.g3{animation-delay:.9s}
@keyframes mgl{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.mrot{transform-origin:120px 120px;animation:mrot 8s linear infinite}
.mrot2{transform-origin:120px 120px;animation:mrot 13s linear infinite reverse}
@keyframes mrot{to{transform:rotate(360deg)}}
.mhalo{transform-origin:120px 120px;animation:mhalo 3.8s ease-in-out infinite}
@keyframes mhalo{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<circle class="mhalo" cx="120" cy="120" r="118" fill="url(#mHalo)"/>
<circle cx="120" cy="120" r="110" fill="url(#mOnyx)"/>
<circle cx="120" cy="120" r="109" fill="none" stroke="#4f79c9" stroke-width="1" opacity=".45"/>
<circle cx="120" cy="120" r="103" fill="none" stroke="url(#mRing)" stroke-width="8"/>
<circle cx="120" cy="120" r="96.5" fill="none" stroke="url(#mSilver)" stroke-width="1.6" opacity=".8"/>
<g class="mrot">
 <circle cx="120" cy="120" r="103" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="30 617" stroke-opacity=".85"/>
 <circle cx="120" cy="120" r="103" fill="none" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 633" stroke-dashoffset="-320" stroke-opacity=".7"/>
</g>
<g class="mrot2">
 <circle cx="120" cy="120" r="96.5" fill="none" stroke="#f4f8ff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="20 586" stroke-opacity=".65"/>
</g>
<g>
 <rect x="76" y="66" width="16" height="108" fill="url(#mFace)"/>
 <rect x="76" y="66" width="3.4" height="108" fill="url(#mEdge)" opacity=".6"/>
 <rect x="148" y="66" width="16" height="108" fill="url(#mFace)"/>
 <rect x="148" y="66" width="3.4" height="108" fill="url(#mEdge)" opacity=".6"/>
 <rect x="92" y="112" width="56" height="15" fill="url(#mFace)"/>
 <rect x="92" y="112" width="56" height="3" fill="#fff7d6" opacity=".7"/>
</g>
<g clip-path="url(#mClip)">
 <rect class="mswp" x="60" y="0" width="90" height="240" fill="url(#mSheen)"/>
</g>
<g fill="#fff8dc">
 <path class="mgl" d="M62 44 l2.2 5.6 5.6 2.2 -5.6 2.2 -2.2 5.6 -2.2 -5.6 -5.6 -2.2 5.6 -2.2 Z"/>
 <path class="mgl g2" d="M178 182 l1.9 4.8 4.8 1.9 -4.8 1.9 -1.9 4.8 -1.9 -4.8 -4.8 -1.9 4.8 -1.9 Z"/>
 <path class="mgl g3" fill="#dfe8f5" d="M186 70 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z"/>
</g>
</svg>
